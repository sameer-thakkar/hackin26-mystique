name: Rollout by Tag

on:
  push:
    tags:
      - '*'

jobs:
  tag_test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v1
      - name: Use Node.js
        uses: actions/setup-node@v1
        with:
          node-version: '12'
      - name: run tests
        timeout-minutes: 10
        run: |
          yarn
          node ./tests/stage.js

  pagespeed_insights:
    runs-on: ubuntu-latest
    needs: tag_rollout

    steps:
      - uses: actions/checkout@v1
      - name: Use Node.js
        uses: actions/setup-node@v1
        with:
          node-version: '12'
      - name: push to prometheus
        timeout-minutes: 10
        run: |
          yarn
          node ./tests/production.js
