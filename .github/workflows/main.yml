name: CI

on:
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v1
      - name: Use Node.js
        uses: actions/setup-node@v1
        with:
          node-version: "10.x"
      - name: rollout to stage
        env:
          ZEIT_TOKEN: ${{ secrets.ZEIT_TOKEN }}
          GIT_BRANCH: ${{ github.head_ref }}
          GIT_ACTOR: ${{ github.actor }}
        run: |
          now --version
          now --token ${ZEIT_TOKEN} --scope headout --target production -e GIT_BRANCH=${GIT_BRANCH} -e GIT_ACTOR=${GIT_ACTOR}
