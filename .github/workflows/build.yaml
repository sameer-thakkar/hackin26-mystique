name: 'Mystique CI'

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest-4-cores
    name: 'build'
    strategy:
      matrix:
        env: ['test', 'production']
        hasTag:
          - ${{ startsWith(github.ref, 'refs/tags/') }}
        exclude:
          - hasTag: false
            env: 'production'
          - hasTag: true
            env: 'test'
    env:
      AWS_EB_S3_BUCKET: ${{ secrets.AWS_EB_S3_BUCKET }}
      APP_ENV: ${{ matrix.env }}
      WAF_API_WHITELIST_TOKEN: ${{ secrets.WAF_API_WHITELIST_TOKEN }}
    outputs:
      dockerImageTag: ${{ steps.docker_meta.outputs.version }}
      ecrRegistryUrl: ${{ steps.login_ecr.outputs.registry }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate Build Arguments
        run: |
          if [ -z "$APP_ENV" ] || [ -z "$WAF_API_WHITELIST_TOKEN" ]; then
              echo "APP_ENV and/or WAF_API_WHITELIST_TOKEN build-args are missing. Exiting workflow."
              exit 1
          fi

      - name: Extract branch name
        shell: bash
        run: echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT
        id: extract_branch

      - uses: actions/setup-node@v4
        with:
          node-version: '20.17.0'

      - name: Setup npm config
        run: |
          echo "registry=https://registry.yarnpkg.com/" > .npmrc
          echo "@headout:registry=https://npm.pkg.github.com" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.NPM_TOKEN }}" >> .npmrc
          echo "always-auth=true" >> .npmrc

      - name: Set AWS credentials
        id: set-aws-credentials
        run: |
          if [[ $APP_ENV == "production" ]]; then
              echo "AWS_REGION=us-east-1" >> "$GITHUB_ENV"
              echo "AWS_ACCESS_KEY=${{ secrets.AWS_ACCESS_KEY_ID }}" >> "$GITHUB_ENV"
              echo "AWS_SECRET_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> "$GITHUB_ENV"
              echo "STATIC_FILES_BUCKET=web-static-assets-production" >> "$GITHUB_ENV"
          else
              echo "AWS_REGION=ap-south-1" >> "$GITHUB_ENV"
              echo "AWS_ACCESS_KEY=${{ secrets.AWS_HEADOUT_TEST_ACCESS_KEY }}" >> "$GITHUB_ENV"
              echo "AWS_SECRET_KEY=${{ secrets.AWS_HEADOUT_TEST_SECRET_KEY }}" >> "$GITHUB_ENV"
              echo "STATIC_FILES_BUCKET=web-static-assets-test-1" >> "$GITHUB_ENV"
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ env.AWS_SECRET_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Restore Node Modules
        uses: actions/cache@v4
        with:
          path: ./node_modules_all
          key: ${{ runner.os }}-nodejs-${{ hashFiles('yarn.lock') }}

      - name: Install Packages
        run: |
          git config --global url."https://${{ github.actor }}:${{ secrets.HEADOUT_CI_PACKAGE_PAT }}@github.com/".insteadOf ssh://git@github.com/
          if [ -d "./node_modules_all" ]; then
            mv ./node_modules_all ./node_modules
          fi
          echo "Installing all dependencies"
          yarn install --frozen-lockfile

      - name: Prepare version label
        run: |
          echo "GIT_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV

      - name: Restore NEXT Build Cache for Production Environment
        id: next-cache-prod
        uses: actions/cache/restore@v4
        if: matrix.env == 'production'
        with:
          path: |
            ./.next/cache
          key: ${{ runner.os }}-nextjs-${{ matrix.env }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ matrix.env }}-

      - name: Restore NEXT Build Cache for Other Environments
        id: next-cache-test
        uses: actions/cache/restore@v4
        if: matrix.env != 'production'
        with:
          path: |
            ./.next/cache
          key: ${{ runner.os }}-nextjs-${{ matrix.env }}-${{ hashFiles('yarn.lock') }}-${{ steps.extract_branch.outputs.branch }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ matrix.env }}-${{ hashFiles('yarn.lock') }}-
            ${{ runner.os }}-nextjs-${{ matrix.env }}-

      - name: Build NEXT
        run: yarn build
        env:
          RELEASE_VERSION: ${{ env.GIT_VERSION }}
          NEXT_PUBLIC_HEADOUT_DOMAIN: 'https://www.headout.com'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR
        id: login_ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Docker meta
        id: docker_meta
        uses: docker/metadata-action@v3
        with:
          images: ${{ steps.login_ecr.outputs.registry }}/container-images/headout-mystique
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch,prefix=${{ matrix.env }}-,suffix=-{{sha}}-{{date 'YYYYMMDD'}}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'master') }}

      - name: Upload Assets to S3 🪣
        run: |
          aws configure set default.s3.max_concurrent_requests 100
          aws s3 cp .next/static s3://$STATIC_FILES_BUCKET/mystique/_next/static --recursive

      - name: Warmup Assets from S3 🪣
        run: |
          node ./ci/scripts/warmup-cache.js
        if: matrix.env == 'production'

      - name: Prepare Node Modules required during Runtime
        run: |
          mv ./node_modules ./node_modules_all
          yarn --production --frozen-lockfile

      - name: Build and Push Docker Image
        id: docker_build
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ci/Dockerfile
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          build-args: |
            APP_ENV=${{ env.APP_ENV }}
            ALT_CANCEL_SLACK_BOT_TOKEN=${{ secrets.ALT_CANCEL_SLACK_BOT_TOKEN }}
            ZENDESK_API_TOKEN=${{ secrets.ZENDESK_API_TOKEN }}
            WAF_API_WHITELIST_TOKEN=${{ env.WAF_API_WHITELIST_TOKEN }}
            NEXT_PUBLIC_HEADOUT_DOMAIN=https://www.headout.com
          cache-from: type=gha,scope=${{ github.workflow }}
          cache-to: type=gha,mode=max,scope=${{ github.workflow }}
          labels: ${{ steps.docker_meta.outputs.labels }}

      - name: Delete existing cache for Production
        if: matrix.env == 'production' && steps.next-cache-prod.outputs.cache-hit == 'true'
        run: |
          curl -X DELETE -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/caches?key=${{ runner.os }}-nextjs-${{ matrix.env }}-${{ hashFiles('yarn.lock') }}"

      - name: Delete existing cache for Other Environments
        if: matrix.env != 'production' && steps.next-cache-test.outputs.cache-hit == 'true'
        run: |
          curl -X DELETE -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/caches?key=${{ runner.os }}-nextjs-${{ matrix.env }}-${{ hashFiles('yarn.lock') }}-${{ steps.extract_branch.outputs.branch }}"

      - name: Save NEXT Build Cache for Production Environment
        uses: actions/cache/save@v4
        if: matrix.env == 'production'
        with:
          path: |
            ./.next/cache
          key: ${{ runner.os }}-nextjs-${{ matrix.env }}-${{ hashFiles('yarn.lock') }}

      - name: Save NEXT Build Cache for Other Environments
        uses: actions/cache/save@v4
        if: matrix.env != 'production'
        with:
          path: |
            ./.next/cache
          key: ${{ runner.os }}-nextjs-${{ matrix.env }}-${{ hashFiles('yarn.lock') }}-${{ steps.extract_branch.outputs.branch }}

  create-eb-version:
    needs: 'build'
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      AWS_EB_S3_BUCKET: ${{ secrets.AWS_EB_S3_BUCKET }}
      APP_ENV: 'production'
      DOCKER_IMAGE_TAG: ${{ needs.build.outputs.dockerImageTag }}
      LONG_DESCRIPTION: ${{ github.event.head_commit.message }}
    steps:
      - uses: actions/checkout@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login_ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Generate deployment package
        id: prepare_deploy
        env:
          ECR_DOCKER_REPO_HOST: ${{ steps.login_ecr.outputs.registry }}
        run: |
          ./ci/scripts/eb.sh
          zip -r mystique-${DOCKER_IMAGE_TAG}.zip Dockerrun.aws.json .ebextensions/

          IMAGE_LABEL=$APP_ENV-${GITHUB_REF#refs/*/}-${GITHUB_SHA::8}-$(date -u +%s)
          TRIM_DESCRIPTION="$(echo $LONG_DESCRIPTION | tr '\n' ' ' | tr '\r' ' ')"
          echo "VERSION_LABEL=$IMAGE_LABEL" >> $GITHUB_ENV
          echo "VERSION_FILE=mystique-${DOCKER_IMAGE_TAG}.zip" >> $GITHUB_ENV
          echo "VERSION_DESCRIPTION=${TRIM_DESCRIPTION:0:199}" >> $GITHUB_ENV

      - name: Upload package to S3 bucket
        run: |
          cat $HOME/.docker/config.json | jq -M '.auths' > .dockercfg
          aws s3 mv .dockercfg s3://$AWS_EB_S3_BUCKET/docker/.dockercfg
          aws s3 cp $VERSION_FILE s3://$AWS_EB_S3_BUCKET/mystique/$VERSION_FILE

      - name: Create new ElasticBeanstalk Application Version
        run: |
          aws elasticbeanstalk create-application-version \
          --application-name mystique \
          --source-bundle S3Bucket="$AWS_EB_S3_BUCKET",S3Key="mystique/$VERSION_FILE" \
          --version-label "github-$VERSION_LABEL" \
          --description "$VERSION_DESCRIPTION"

  qa-automation:
    needs: 'build'
    runs-on: ubuntu-latest
    steps:
      - name: Print Docker Image Tag
        run: |
          echo "Docker Image Tag: ${{ needs.build.outputs.dockerImageTag }}"

      - name: Run Sanity
        run: |
          curl --location "${{ secrets.MEDUSA_TEST_URL }}/twirp/medusa.pb.qa.automation.QaAutomationService/RunTestSuite" \
          --header 'Content-Type: application/json' \
          --header 'Accept: application/json' \
          --data '{
            "commit_id": "${{ github.sha }}",
            "tag": "${{ needs.build.outputs.dockerImageTag }}",
            "test_suite": "SANITY"
          }'
