on:
  pull_request:
    branches:
      - master

jobs:
  ci_non_prod:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v1
      - name: Use Node.js
        uses: actions/setup-node@v1
        with:
          node-version: '12'
      - name: prepare now build ready for aliasing
        timeout-minutes: 10
        env:
          GIT_BRANCH: ${{ github.head_ref }}
          GIT_ACTOR: ${{ github.actor }}
        run: |
          sudo yarn
          yarn build
