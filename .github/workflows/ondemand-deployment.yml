name: Deploy Mystique on Ondemand test environment
on:
  workflow_dispatch:
    inputs:
      mystique_branch:
        required: true
        description: 'Branch to be deployed'
        type: string
      environment:
        required: true
        description: 'OnDemand test environment name'
        type: string
jobs:
  mystique-build:
    name: Building Mystique
    runs-on: ubuntu-latest
    outputs:
      dockerImageTag: ${{ steps.docker_meta.outputs.version }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v3
        with:
          persist-credentials: false
          ref: ${{ inputs.mystique_branch }}
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: yarn build
        env:
          DEPLOY_NAMESPACE: ${{ inputs.environment }}
        run: |
          git config --global url."https://${{ github.actor }}:${{ secrets.HEADOUT_CI_PACKAGE_PAT }}@github.com/".insteadOf ssh://git@github.com/
          yarn
          export NEXT_PUBLIC_API_BASE_URL=https://${{ inputs.environment }}.deimos.test-headout.com
          export NEXT_PUBLIC_API_CDN_BASE_URL=https://${{ inputs.environment }}.api.test-headout.com
          export NEXT_PUBLIC_BASE_HOST=${{ inputs.environment }}.deimos.test-headout.com
          export NEXT_PUBLIC_BASE_URL=https://${{ inputs.environment }}.deimos.test-headout.com
          export NEXT_PUBLIC_API_BASE_URL_INTERNAL=http://calipso.${{ inputs.environment }}.svc.cluster.local
          export NEXT_PUBLIC_NODE_ENV=test
          export NEXT_PUBLIC_HEADOUT_DOMAIN=https://${{ inputs.environment }}.deimos.test-headout.com
          export NODE_OPTIONS=--max-old-space-size=8192
          yarn next build
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1
      - name: Cache Docker layers
        uses: actions/cache@v2
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ env.DEPLOY_NAMESPACE }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ env.DEPLOY_NAMESPACE }}-
            ${{ runner.os }}-buildx-
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
      - name: Docker meta
        id: docker_meta
        uses: docker/metadata-action@v3
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/headout/mystique
          flavor: |
            prefix=${{ env.DEPLOY_NAMESPACE }}
            suffix=-{{sha}}
      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ci/Dockerfile
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          build-args: |
            APP_ENV=${{ env.APP_ENV }}
            ALT_CANCEL_SLACK_BOT_TOKEN=${{ secrets.ALT_CANCEL_SLACK_BOT_TOKEN }}
            ZENDESK_API_TOKEN=${{ secrets.ZENDESK_API_TOKEN }}
            NEXT_PUBLIC_HEADOUT_DOMAIN=https://${{ inputs.environment }}.deimos.test-headout.com
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new
          labels: ${{ steps.docker_meta.outputs.labels }}
  deploy:
    name: Deploying Mystique
    runs-on: ubuntu-latest
    needs: mystique-build
    steps:
      - name: Checkout sources
        uses: actions/checkout@main
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Deploy Chart
        env:
          DEPLOY_NAMESPACE: ${{ inputs.environment }}
          ENV: ${{ inputs.env }}
          MYSTIQUE_V: ${{ needs.mystique-build.outputs.dockerImageTag }}
          HELM_REPOSITORY: 'oci://999499138329.dkr.ecr.ap-south-1.amazonaws.com'
          CLUSTER_NAME: 'headout-env-test-ondemand'
          AWS_REGION: 'ap-south-1'
        run: |
          ./ci/scripts/on-demand-deploy.sh
