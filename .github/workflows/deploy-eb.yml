# Mystique CI workflow
---
name: 'Mystique CI'
on:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    name: 'CI (Build)'
    env:
      APP_ENV: 'production'
    steps:
      - uses: actions/checkout@v2
      - name: Setup Node
        uses: actions/setup-node@v2
        with:
          node-version: '15.11.x'
      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "::set-output name=dir::$(yarn cache dir)"
      - name: Cache node modules + NEXT cache
        uses: actions/cache@v2
        with:
          path: |
            ${{ steps.yarn-cache-dir-path.outputs.dir }}
            ./.next/cache
          key: ${{ runner.os }}-build-npm-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-build-npm-
            ${{ runner.os }}-build-
            ${{ runner.os }}-
      - name: Install Packages
        run: yarn
      - name: Cache built NEXT
        uses: actions/cache@v2
        with:
          path: |
            ./.next
            ./node_modules
          key: ${{ runner.os }}-buildnext-${{ github.sha }}
      - name: Prepare version label
        run: |
          echo "GIT_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
      - name: Build NEXT
        run: npm run build
        env:
          NODE_ENV: ${{ env.APP_ENV }}
          DIST_URL_PATH: ${{ env.GIT_VERSION }}
          RELEASE_VERSION: ${{ env.GIT_VERSION }}
  deploy:
    name: 'CD (Deploy)'
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: ['production']
    env:
      AWS_EB_S3_BUCKET: ${{ secrets.AWS_EB_S3_BUCKET }}
      APP_ENV: ${{ matrix.env }}
      NEXT_PUBLIC_HEADOUT_DOMAIN: 'https://www.headout.com'
      NEXT_PUBLIC_HEADOUT_API_DOMAIN: 'https://api.headout.com'
      SLACK_GRP_BKNG_WEBHOOK: 'https://hooks.slack.com/services/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'
      ZENDESK_GRP_BKNG_TOKEN: ${{ secrets.ZENDESK_GRP_BKNG_TOKEN }}
    steps:
      - uses: actions/checkout@v2
      - name: Load from cache
        uses: actions/cache@v2
        with:
          path: |
            ./.next
            ./node_modules
          key: ${{ runner.os }}-buildnext-${{ github.sha }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1
      - name: Cache Docker layers
        uses: actions/cache@v2
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ matrix.env }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ matrix.env }}-
            ${{ runner.os }}-buildx-
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
      - name: Docker meta
        id: docker_meta
        uses: docker/metadata-action@v3
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/headout/mystique
          flavor: |
            prefix=${{ matrix.env }}-
            suffix=-{{sha}}
      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ci/Dockerfile
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          build-args: |
            APP_ENV=${{ env.APP_ENV }}
            NEXT_PUBLIC_HEADOUT_DOMAIN=${{ env.NEXT_PUBLIC_HEADOUT_DOMAIN }}
            NEXT_PUBLIC_HEADOUT_API_DOMAIN=${{ env.NEXT_PUBLIC_HEADOUT_API_DOMAIN }}
            SLACK_GRP_BKNG_WEBHOOK=${{ env.SLACK_GRP_BKNG_WEBHOOK }}
            ZENDESK_GRP_BKNG_TOKEN=${{ env.ZENDESK_GRP_BKNG_TOKEN }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new
          labels: ${{ steps.docker_meta.outputs.labels }}
      - name: Generate deployment package
        id: prepare_deploy
        env:
          ECR_DOCKER_REPO_HOST: ${{ steps.login-ecr.outputs.registry }}
          DOCKER_IMAGE_TAG: ${{ steps.docker_meta.outputs.version }}
          LONG_DESCRIPTION: ${{ github.event.head_commit.message }}
        run: |
          ./ci/scripts/eb.sh
          zip -r mystique-${DOCKER_IMAGE_TAG}.zip Dockerrun.aws.json .ebextensions/

          IMAGE_LABEL=$APP_ENV-${GITHUB_REF#refs/*/}-${GITHUB_SHA::8}-$(date -u +%s)
          echo "VERSION_LABEL=$IMAGE_LABEL" >> $GITHUB_ENV
          echo "VERSION_FILE=mystique-${DOCKER_IMAGE_TAG}.zip" >> $GITHUB_ENV
          echo "VERSION_DESCRIPTION=${LONG_DESCRIPTION:0:199}" >> $GITHUB_ENV
      - name: Upload package to S3 bucket
        run: |
          cat $HOME/.docker/config.json | jq -M '.auths' > .dockercfg
          aws s3 mv .dockercfg s3://$AWS_EB_S3_BUCKET/docker/.dockercfg
          aws s3 cp $VERSION_FILE s3://$AWS_EB_S3_BUCKET/mystique/$VERSION_FILE
      - name: Create new ElasticBeanstalk Application Version
        run: |
          aws elasticbeanstalk create-application-version \
          --application-name mystique \
          --source-bundle S3Bucket="$AWS_EB_S3_BUCKET",S3Key="mystique/$VERSION_FILE" \
          --version-label "github-$VERSION_LABEL" \
          --description "$VERSION_DESCRIPTION"
        # This ugly bit is necessary if you don't want your cache to grow forever
        # till it hits GitHub's limit of 5GB.
        # Temp fix
        # https://github.com/docker/build-push-action/issues/252
        # https://github.com/moby/buildkit/issues/1896
      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache
