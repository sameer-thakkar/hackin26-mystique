name: Rollout by Tag

on:
  push:
    tags:
      - '*'

jobs:
  tag_test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v1
      - name: Use Node.js
        uses: actions/setup-node@v1
        with:
          node-version: '10.x'
      - name: Use Yarn
        uses: 'borales/actions-yarn@v2.0.0'
      - name: run tests
        run: |
          yarn
          node ./tests/stage.js

  tag_rollout:
    runs-on: ubuntu-latest
    needs: tag_test

    steps:
      - uses: actions/checkout@v1
      - name: Use Node.js
        uses: actions/setup-node@v1
        with:
          node-version: '10.x'
      - name: now deploy
        env:
          ZEIT_TOKEN: ${{ secrets.ZEIT_TOKEN }}
        run: |
          sudo rm /usr/local/bin/now
          sudo npm i -g now@16.4.4
          now --version
          node ./deployment/production
          find now.*.json | xargs -n1 -I {} /bin/bash -c 'now --token ${ZEIT_TOKEN} -A {} --scope headout --prod --no-clipboard --debug'

  pagespeed_insights:
    runs-on: ubuntu-latest
    needs: tag_rollout

    steps:
      - uses: actions/checkout@v1
      - name: Use Node.js
        uses: actions/setup-node@v1
        with:
          node-version: '10.x'
      - name: Use Yarn
        uses: 'borales/actions-yarn@v2.0.0'
      - name: push to prometheus
        run: |
          yarn
          node ./tests/production.js
